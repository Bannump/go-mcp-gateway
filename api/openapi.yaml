openapi: "3.1.0"
info:
  title: go-mcp-gateway
  version: "1.0.0"
  description: MCP (Model Context Protocol) gateway over HTTP with OIDC authentication.

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  /mcp:
    post:
      summary: Send a JSON-RPC 2.0 MCP request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JSONRPCRequest"
      responses:
        "200":
          description: JSON-RPC response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONRPCResponse"
        "401":
          description: Unauthorized
        "429":
          description: Rate limit exceeded

  /mcp/events:
    get:
      summary: SSE stream for server-initiated notifications
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Unauthorized

  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              example: {"status": "ok"}

  /readyz:
    get:
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Server is ready
        "503":
          description: Server is not ready

  /metrics:
    get:
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text format metrics

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    JSONRPCRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        method:
          type: string
        params:
          type: object

    JSONRPCResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        result:
          description: Present on success
        error:
          $ref: "#/components/schemas/RPCError"

    RPCError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
